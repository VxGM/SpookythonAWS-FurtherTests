<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" aria-labelledby="title description" role="img" viewBox="0 0 1120 560"><title id="title">Arquitectura desplegable de Manta Cero</title><desc id="description">El navegador ejecuta SEIR local. CloudFront sirve S3 privado por OAC y API Gateway conecta una Lambda síncrona. OpenAI es opcional para noticias. DynamoDB está provisionado pero no conectado al handler.</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#334155" d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1120" height="560" fill="#f8fafc"/><g fill="#0f172a" font-family="Arial,sans-serif"><text x="30" y="36" font-size="23" font-weight="bold">Manta Cero · arquitectura desplegable actual</text><text x="30" y="62" font-size="14">Fuente editable: arquitectura.mmd · infraestructura: infra/template.yaml · sin orquestación asíncrona</text><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M230 235H285"/><path d="M475 218L535 132"/><path d="M475 250L535 280"/><path d="M735 280H790"/><path d="M890 245V150"/><path d="M890 315V400"/><path stroke-dasharray="6 5" d="M835 315L700 400"/></g><g fill="#fff" stroke="#94a3b8"><rect width="200" height="105" x="30" y="185" rx="10"/><rect width="190" height="105" x="285" y="185" rx="10"/><rect width="200" height="85" x="535" y="90" rx="10"/><rect width="200" height="75" x="535" y="245" rx="10"/><rect width="280" height="75" x="790" y="245" rx="10"/><rect width="280" height="60" x="790" y="90" rx="10"/><rect width="280" height="60" x="790" y="400" rx="10"/><rect width="280" height="85" x="460" y="400" stroke-dasharray="6 5" rx="10"/></g><g font-size="16" text-anchor="middle"><text x="130" y="215" font-weight="bold">Navegador público</text><text x="130" y="240">React + SEIR local</text><text x="130" y="264" font-size="13">Partida y evaluación Monte Carlo</text><text x="380" y="222" font-weight="bold">CloudFront HTTPS</text><text x="380" y="247">Mismo origen</text><text x="380" y="271" font-size="13">Assets públicos; API autenticada</text><text x="635" y="120" font-weight="bold">S3 privado</text><text x="635" y="147">Assets web · OAC</text><text x="635" y="275" font-weight="bold">API Gateway HTTP</text><text x="635" y="301">Stage /prod</text><text x="930" y="274" font-weight="bold">Lambda ARM64 · síncrona</text><text x="930" y="300" font-size="13">Auth · noticias · simulate · mayor-report</text><text x="930" y="115" font-weight="bold">OpenAI opcional</text><text x="930" y="138" font-size="13">Solo noticias; respaldo determinista</text><text x="930" y="425" font-weight="bold">CloudWatch</text><text x="930" y="448" font-size="13">Logs y métricas</text><text x="600" y="428" font-weight="bold">DynamoDB provisionado</text><text x="600" y="451" font-size="13">TABLE_NAME configurado</text><text x="600" y="472" font-size="13">Sin lecturas/escrituras del handler</text></g><text x="485" y="218" font-size="12">OAC</text><text x="466" y="348" font-size="12">/api/* · /simulate · /mayor-report</text><text x="30" y="525" font-size="14">Línea discontinua: recurso configurado, no integración ejecutada. No se representa Step Functions ni jobs en producción.</text></g></svg>